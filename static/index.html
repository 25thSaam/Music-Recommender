<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Recommender</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">

    <!-- <Header /> -->
    <header class="app-header">
      <h1 class="app-header__title">Music Recommender</h1>
      <p class="app-header__subtitle">Tell us what you like and we'll suggest what to play next.</p>
    </header>

    <main>
      <!-- <SearchForm /> -->
      <form id="search-form" class="search-form">
        <div class="search-form__field search-form__field--wide">
          <label for="query">Song or artist you like</label>
          <input id="query" name="query" type="text" placeholder="e.g. Blinding Lights" required />
        </div>

        <div class="search-form__field">
          <label for="mood">Mood</label>
          <select id="mood" name="mood">
            <option value="">Any</option>
            <option value="happy">Happy</option>
            <option value="chill">Chill</option>
            <option value="energetic">Energetic</option>
            <option value="sad">Sad</option>
            <option value="focus">Focus</option>
          </select>
        </div>

        <div class="search-form__field">
          <label for="limit">How many</label>
          <select id="limit" name="limit">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </div>

        <button id="submit-btn" class="search-form__button" type="submit">Recommend</button>
      </form>

      <!-- <Results /> is rendered into this div by app.js -->
      <section id="results" class="results" aria-live="polite"></section>
    </main>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
